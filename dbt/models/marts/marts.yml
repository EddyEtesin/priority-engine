
version: 2

models:
  - name: fct_support_tickets
    description: >
      Central ticket fact table. One row per support ticket,
      combining ticket attributes, priority classification and SLA metrics.

    columns:
      - name: ticket_id
        data_tests:
          - unique
          - not_null

      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id

      - name: agent_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_agents')
                field: agent_id

      - name: priority_band
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['P1', 'P2', 'P3', 'P4']

      - name: priority_score
        data_tests:
          - not_null

      - name: first_response_sla_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['met', 'breached', 'at_risk', 'on_track']

      - name: resolution_sla_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['met', 'breached', 'at_risk', 'on_track']

  - name: dim_customers
    description: Customer-level attributes and support history.

    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null

      - name: customer_tier
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['standard', 'premium', 'enterprise']

  - name: dim_agents
    description: Distinct support agent identifiers and ticket activity dates.

    columns:
      - name: agent_id
        data_tests:
          - unique
          - not_null

  - name: mart_agent_performance
    description: Aggregated workload and service performance by agent.

    columns:
      - name: agent_id
        data_tests:
          - unique
          - not_null

  - name: mart_category_performance
    description: Aggregated ticket volume and service performance by category.

    columns:
      - name: category
        data_tests:
          - unique
          - not_null
